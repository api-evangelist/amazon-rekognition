docs: https://docs.aws.amazon.com/cli/latest/reference/rekognition/
repo: https://github.com/aws/aws-cli
binary: aws
command_group: aws rekognition <command>
install:
  pip: pip install awscli
  homebrew: brew install awscli
  bundled_installer: https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html
auth:
  detail: Uses AWS credentials/profile (aws configure); signs requests with SigV4.
commands:
  image_analysis:
